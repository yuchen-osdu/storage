# Default values for storage-deploy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  domain: ""
  # Host the HTTPRoute attaches to when httpRoute.hostnames is empty.
  hostname: ""
  limitsEnabled: true
  dataPartitionId: ""

# This flag enables configuration specific to ROSA environments.
rosa: false 

data:
  # configmaps
  logLevel: "ERROR"
  defaultDataCountry: "US"
  storageServiceAccountEmail: "storage@service.local"
  entitlementsHost: "http://entitlements"
  partitionHost: "http://partition"
  crsConverterHost: "http://crs-conversion"
  legalHost: "http://legal"
  opaEnabled: false
  opaEndpoint: "http://opa"
  # Otel
  javaToolOptions: ""
  otelExporterEndpoint: ""
  otelExporterProtocol: ""
  # PubSub topic configuration
  pubsubSearchTopicV2: "records-changed-v2"
  # deployments
  requestsCpu: "7m"
  requestsMemory: "450Mi"
  limitsCpu: "1"
  limitsMemory: "3G"
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "storage"
  # redis connection. Change it if you want to use external redis
  redisStorageHost: ""
  redisStoragePort: 6379
  redisImage: "docker.io/library/redis:7"

conf:
  appName: "storage"
  keycloakSecretName: "storage-keycloak-secret"
  s3SecretName: "storage-seaweedfs-secret"
  postgresSecretName: "storage-postgres-secret"
  rabbitmqSecretName: "rabbitmq-secret"
  replicas: 3
  storageRedisSecretName: "storage-redis-secret"

httpRoute:
  enabled: false
  # Route name. Defaults to "<release>-route" so it never collides with a route of the same name
  # defined outside this chart.
  name: ""
  parentRefs:
    - name: cimpl-gateway
      namespace: istio-system
  # Defaults to global.hostname when empty. The render fails when both are empty.
  hostnames: []
  # One rule per entry. Optional per entry: pathType (default PathPrefix), serviceName
  # (default conf.appName), port (default 80) and filters (for example URLRewrite).
  routes:
    - path: /api/storage/

istio:
  proxyCPU: "5m"
  proxyCPULimit: "200m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "256Mi"
